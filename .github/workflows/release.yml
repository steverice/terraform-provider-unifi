name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v2026.02.09)"
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    steps:
      - name: Checkout provider
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: terraform-provider-unifi

      - name: Checkout go-unifi dependency
        uses: actions/checkout@v4
        with:
          repository: steverice/go-unifi
          path: go-unifi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "terraform-provider-unifi/go.mod"
          check-latest: false

      - name: Determine version
        id: version
        working-directory: terraform-provider-unifi
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # Date-based version: vYYYY.MM.DD. A 4th component (v2026.06.03.1)
            # is NOT valid semver and goreleaser hard-fails on it, so same-day
            # re-releases future-date by one day instead (semver-valid and
            # monotonic). A third same-day release exhausts that; pass an
            # explicit 'tag' input via workflow_dispatch in that case.
            TAG="v$(date -u +'%Y.%m.%d')"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              TAG="v$(date -u -d '+1 day' +'%Y.%m.%d')"
              if git rev-parse "$TAG" >/dev/null 2>&1; then
                echo "Both today's and tomorrow's date tags exist; re-run with an explicit 'tag' input." >&2
                exit 1
              fi
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: terraform-provider-unifi
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Import GPG key
        if: env.GPG_PRIVATE_KEY != ''
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: >-
            release --parallelism 2 --clean
            ${{ steps.import_gpg.outputs.fingerprint == '' && '--skip=sign' || '' }}
          workdir: terraform-provider-unifi
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
